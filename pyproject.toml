[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mailplus-intelligence"
version = "0.1.0"
description = "Python foundations for MailPlus-derived intelligence workflows."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "OMT-Global" }
]
dependencies = []

[project.optional-dependencies]
llm = [
  "anthropic>=0.40,<1.0",
]

[project.scripts]
mpi = "mailplus_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
