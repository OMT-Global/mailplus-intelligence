name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the exact commands or steps that reproduce the problem.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mpi --version
      placeholder: mpi 0.1.1
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: mpi doctor output
      render: text
      placeholder: Paste the full `mpi doctor` output.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python
      placeholder: macOS 15.5, Python 3.12.9
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Runtime mode
      options:
        - Fixture mode only
        - Live adapter mode
        - Not sure
    validations:
      required: true
